# GitHub Actions workflow for Beer2beer .NET 8 Web API
# Builds, tests, and validates the Clean Architecture solution

name: Build & Test

on:
  push:
    branches: [ "master", "main", "develop" ]
  pull_request:
    branches: [ "master", "main", "develop" ]
  workflow_dispatch: # Allow manual trigger

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_FILE: 'Beer2beer.sln'
  TEST_PROJECT: 'Beer2beer.UnitTest/Beer2beer.UnitTest.csproj'

jobs:
  build:
    name: Build Solution
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better analysis

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }}

    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_FILE }} --no-restore --configuration Release

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }}

    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_FILE }} --no-restore --configuration Release

    - name: Run unit tests
      run: |
        dotnet test ${{ env.TEST_PROJECT }} \
          --no-build \
          --configuration Release \
          --verbosity normal \
          --logger "trx;LogFileName=test-results.trx" \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: ./TestResults
        retention-days: 7

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-reports
        path: ./TestResults/**/coverage.cobertura.xml
        retention-days: 7

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }}

    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_FILE }} --no-restore --configuration Release

    - name: Check for build warnings
      run: |
        $warnings = dotnet build ${{ env.SOLUTION_FILE }} --configuration Release 2>&1 | Select-String -Pattern "warning"
        if ($warnings) {
          Write-Host "Build warnings found:"
          $warnings
        }

    - name: Verify solution structure
      run: |
        Write-Host "Solution structure verification:"
        Write-Host "- API Project: Beer2beer.API"
        Write-Host "- Core Project: Beer2beer.Core"
        Write-Host "- Infrastructure Project: Beer2beer.Infrastructure"
        Write-Host "- Test Project: Beer2beer.UnitTest"
        
        # Verify all projects exist
        $projects = @(
          "Beer2beer.API/Beer2beer.API.csproj",
          "Beer2beer.Core/Beer2beer.Core.csproj",
          "Beer2beer.Infrastructure/Beer2beer.Infrastructure.csproj",
          "Beer2beer.UnitTest/Beer2beer.UnitTest.csproj"
        )
        
        foreach ($project in $projects) {
          if (Test-Path $project) {
            Write-Host "✓ $project found"
          } else {
            Write-Host "✗ $project NOT found"
            exit 1
          }
        }
